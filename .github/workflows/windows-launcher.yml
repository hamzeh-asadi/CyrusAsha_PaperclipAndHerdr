name: Windows dashboard launcher

on:
  push:
    paths:
      - '.github/workflows/windows-launcher.yml'
      - 'setup-dashboard.*'
      - 'scripts/windows-*.ps1'
      - 'tests/test_windows_*.ps1'
      - 'tests/smoke_herdr_session.py'
      - 'dashboard/*.py'
      - 'dashboard/*.json'
      - 'dashboard/*.js'
      - 'dashboard/*.html'
      - 'dashboard/*.css'
      - 'dashboard/brand/**'

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test discovery and readiness in Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\test_windows_launcher.ps1
          .\tests\test_windows_readiness.ps1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: |
            3.14
            3.15
      - name: Probe and exercise both real interpreters
        shell: powershell
        run: |
          . .\scripts\windows-python.ps1
          foreach ($minor in '3.14', '3.15') {
            $python = Resolve-DashboardPython -PythonVersion $minor
            Write-Host "Testing Python $($python.Version): $($python.Executable)"
            & $python.Executable -m unittest discover -s dashboard -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check discovery with a real isolated Windows Herdr server (no agent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'herdr-v0.9.5.zip'
          Invoke-WebRequest 'https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-windows-x86_64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'd2c6c9c971c43a0bfdde8c692a9a1a7a45c3e4807cd01ae45662b4734fac1cbf') { throw 'Herdr archive digest mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'Herdr release'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $binary = (Get-ChildItem $dest -Recurse -File -Filter herdr.exe -ErrorAction Stop).FullName
          python tests/smoke_herdr_session.py "$binary"
          exit $LASTEXITCODE
