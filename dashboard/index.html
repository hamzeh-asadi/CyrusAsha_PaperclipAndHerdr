<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paperclip+Herdr Unified Dashboard</title>
  <style>
    :root {
      --foreground: #0f0f0f;
      --muted-foreground: #737373;
      --accent: #3b82f6;
      --border: #e4e4e7;
      --card: #fafafa;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--card);
      color: var(--foreground);
      line-height: 1.5;
      padding: 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.875rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: var(--border);
      color: var(--muted-foreground);
    }

    .status-badge.online {
      background: var(--success);
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1rem;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: white;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .agent-name {
      font-weight: 600;
    }

    .agent-type {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: white;
      color: var(--foreground);
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.15s;
    }

    .btn:hover {
      background: var(--card);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .prompt-box {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    textarea {
      width: 100%;
      height: 60px;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.875rem;
      resize: vertical;
    }

    .output-section {
      flex: 1;
      min-height: 120px;
      background: var(--card);
      border-radius: 0.5rem;
      padding: 0.5rem;
      overflow: auto;
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .output-section.empty {
      color: var(--muted-foreground);
      text-align: center;
    }

    .output-section.error {
      color: var(--danger);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .tab {
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--muted-foreground);
      font-size: 0.875rem;
    }

    .tab.active {
      border-bottom-color: var(--accent);
      color: var(--foreground);
      font-weight: 600;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .ticket-item {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .ticket-item:last-child {
      border-bottom: none;
    }

    .ticket-title {
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .ticket-meta {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      display: flex;
      gap: 1rem;
    }

    .badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.todo { background: #e0f2fe; color: #0369a1; }
    .badge.in_progress { background: #fef9c3; color: #a16207; }
    .badge.in_review { background: #dcfce7; color: #15803d; }
    .badge.blocked { background: #fee2e2; color: #b91c1c; }

    .refresh-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .loading {
      color: var(--muted-foreground);
      font-size: 0.875rem;
    }

    .error {
      color: var(--danger);
      font-size: 0.875rem;
    }

    .poll-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted-foreground);
      animation: pulse 1.5s infinite;
    }

    .poll-indicator.active {
      background: var(--accent);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .manual-prompt-section {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Paperclip+Herdr Unified Dashboard</h1>
      <div class="refresh-controls">
        <span id="pollIndicator" class="poll-indicator"></span>
        <button class="btn btn-primary" onclick="refreshAll()">بارگذاری مجدد</button>
        <span id="statusBadge" class="status-badge">در حال اتصال...</span>
      </div>
    </header>

    <p id="connectionMessage" class="error" role="status" hidden></p>

    <nav class="tabs">
      <div class="tab active" onclick="switchTab('agents')">ایجنت‌ها</div>
      <div class="tab" onclick="switchTab('tickets')">تیکت‌ها</div>
    </nav>

    <!-- Agents Tab -->
    <div id="agentsTab" class="tab-content active">
      <div class="grid" id="agentsGrid"></div>
    </div>

    <!-- Tickets Tab -->
    <div id="ticketsTab" class="tab-content">
      <div id="ticketsList" class="grid" style="grid-template-columns: 1fr;"></div>
    </div>
  </div>

  <script>
    // Same origin as the page, so a custom DASHBOARD_PORT keeps working
    const API_BASE = "/api";
    const POLL_INTERVAL = 5 * 1000; // 5 seconds
    let pollTimer = null;
    let refreshing = false;
    let paperclipOnline = false;

    // State
    let agents = [];
    let tickets = [];
    // Last fetched output and typed prompt per agent, so the 5s re-render does not wipe them
    const agentOutputs = {};
    const promptDrafts = {};

    // Load from localStorage on init
    document.addEventListener("DOMContentLoaded", () => {
      try { loadState(); } catch { /* invalid or unavailable cache */ }
      refreshAll();
      startPolling();
    });

    function loadState() {
      const storedAgents = localStorage.getItem("dashboard_agents");
      const storedTickets = localStorage.getItem("dashboard_tickets");
      if (storedAgents) agents = JSON.parse(storedAgents);
      if (storedTickets) tickets = JSON.parse(storedTickets);
    }

    function saveState() {
      // Cache presentation fields only, never adapter config or ticket bodies.
      localStorage.setItem("dashboard_agents", JSON.stringify(agents.map(({id, name, adapterType, role, status, lastHeartbeatAt}) =>
        ({id, name, adapterType, role, status, lastHeartbeatAt}))));
      localStorage.setItem("dashboard_tickets", JSON.stringify(tickets.map(({id, title, status}) => ({id, title, status}))));
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function refreshAll() {
      if (refreshing) return;
      refreshing = true;
      const messages = new Set();
      try {
        // A new instance can be healthy with no companies and no agents.
        paperclipOnline = (await fetchJson("/health")).paperclip === true;
        if (!paperclipOnline) throw new Error("Paperclip آماده نیست. خروجی npm start و آدرس PAPERCLIP_API_URL را بررسی کنید.");
        const [a, t] = await Promise.allSettled([
          fetchJson(`${API_BASE}/agents`), fetchJson(`${API_BASE}/tickets`)
        ]);
        agents = a.status === "fulfilled" ? a.value.agents : [];
        tickets = t.status === "fulfilled" ? t.value.tickets : [];
        for (const result of [a, t]) {
          if (result.status === "rejected") messages.add(result.reason.message);
        }
      } catch (err) {
        paperclipOnline = false;
        agents = [];
        tickets = [];
        messages.add(err.message);
      } finally {
        refreshing = false;
      }
      const notice = document.getElementById("connectionMessage");
      notice.textContent = [...messages].join(" — ");
      notice.hidden = !messages.size;
      updateUI();
      try { saveState(); } catch { /* storage may be disabled */ }
    }

    async function triggerHeartbeat(agentId, btn) {
      btn.disabled = true;
      btn.textContent = "در حال ارسال...";

      try {
        const data = await fetchJson(`${API_BASE}/agents/${encodeURIComponent(agentId)}/heartbeat/invoke`, {
          method: "POST"
        });
        if (data.status === "triggered") {
          // Trigger output refresh after a short delay
          setTimeout(refreshAgentOutput, 1500, agentId);
        }
      } catch (e) {
        alert(`بیدارباش ارسال نشد: ${e.message}`);
      }

      btn.disabled = false;
      btn.textContent = "بیدار کردن";
    }

    async function refreshAgentOutput(agentId) {
      try {
        const data = await fetchJson(`${API_BASE}/agents/${encodeURIComponent(agentId)}/output`);
        agentOutputs[agentId] = {
          text: data.success ? (data.output || "خروجی خالی") : (data.error || "خطا در خواندن خروجی"),
          error: !data.success
        };
        const outputContainer = document.getElementById(`output-${agentId}`);
        if (outputContainer) {
          outputContainer.textContent = agentOutputs[agentId].text;
          outputContainer.classList.remove("empty", "error");
          if (agentOutputs[agentId].error) outputContainer.classList.add("error");
        }
      } catch (e) {
        console.error("Failed to fetch agent output:", e);
      }
    }

    function updateUI() {
      updateAgentsUI();
      updateTicketsUI();
      updateGlobalStatus();
    }

    function updateAgentsUI() {
      const grid = document.getElementById("agentsGrid");

      // Only rebuild the cards when the data actually changed, otherwise the 5s poll
      // would drop the textarea focus and the typed manual prompt.
      const signature = agents
        .map(a => JSON.stringify([a.id, a.name, a.adapterType, a.role, a.status, a.lastHeartbeatAt]))
        .join(";");
      if (grid.dataset.signature === signature && grid.childElementCount === agents.length) {
        return;
      }
      grid.dataset.signature = signature;
      grid.innerHTML = "";

      if (agents.length === 0) {
        grid.innerHTML = `<div class="card"><div class="status-row"><span>هیچ ایجنتی یافت نشد</span></div></div>`;
        return;
      }

      agents.forEach(agent => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="agent-name">${escapeHtml(agent.name)}</div>
              <div class="agent-type">${escapeHtml(agent.adapterType || "unknown")}</div>
            </div>
            <div class="status-badge ${agent.status === "running" ? "online" : ""}">
              ${escapeHtml(agent.status || "نامشخص")}
            </div>
          </div>
          <div class="status-row">
            <span>نقش: ${escapeHtml(agent.role || "unknown")}</span>
          </div>
          <div class="status-row">
            <span>آخرین بیدار: ${agent.lastHeartbeatAt ? formatTime(agent.lastHeartbeatAt) : "ثبت نشده"}</span>
          </div>
          <div class="status-row">
            <button class="btn btn-primary wake-agent">
              بیدار کردن
            </button>
          </div>
          <div class="manual-prompt-section">
            <div style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">پرامپت دستی</div>
            <div class="prompt-box">
              <textarea placeholder="هر نوع دستوری برای این ایجنت..."></textarea>
              <button class="btn send-prompt">ارسال پرامپت</button>
            </div>
          </div>
          <div class="output-section empty">
            خروجی اخیر...
          </div>
        `;
        const wakeButton = card.querySelector(".wake-agent");
        wakeButton.addEventListener("click", () => triggerHeartbeat(agent.id, wakeButton));
        card.querySelector(".send-prompt").addEventListener("click", () => sendManualPrompt(agent.id));
        card.querySelector(".output-section").id = `output-${agent.id}`;
        const promptBox = card.querySelector("textarea");
        promptBox.id = `prompt-${agent.id}`;
        promptBox.value = promptDrafts[agent.id] || "";
        promptBox.addEventListener("input", () => { promptDrafts[agent.id] = promptBox.value; });

        const cachedOutput = agentOutputs[agent.id];
        if (cachedOutput) {
          const outputEl = card.querySelector(".output-section");
          outputEl.textContent = cachedOutput.text;
          outputEl.classList.remove("empty", "error");
          if (cachedOutput.error) outputEl.classList.add("error");
        }

        grid.appendChild(card);
      });
    }

    async function sendManualPrompt(agentId) {
      const textarea = document.getElementById(`prompt-${agentId}`);
      const prompt = textarea.value.trim();
      if (!prompt) return alert("لطفاً یک پرامپت وارد کنید");

      try {
        const data = await fetchJson(`${API_BASE}/agents/${encodeURIComponent(agentId)}/prompt`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        if (data.status === "not_implemented_yet") return alert("ارسال پرامپت دستی هنوز پیاده‌سازی نشده است.");
        alert(data.message || "پرامپت ارسال شد");
        textarea.value = "";
        setTimeout(refreshAgentOutput, 2000, agentId);
      } catch (e) {
        alert("خطا در ارسال پرامپت");
      }
    }

    function updateTicketsUI() {
      const list = document.getElementById("ticketsList");
      list.innerHTML = "";

      if (tickets.length === 0) {
        list.innerHTML = `<div class="ticket-item">هیچ تیکتی یافت نشد</div>`;
        return;
      }

      tickets.forEach(ticket => {
        const item = document.createElement("div");
        item.className = "ticket-item";
        const statusClass = ["todo", "in_progress", "in_review", "blocked"].includes(ticket.status) ? ticket.status : "";

        item.innerHTML = `
          <div class="ticket-title">${escapeHtml(ticket.title || "بدون عنوان")}</div>
          <div class="ticket-meta">
            <span class="badge ${statusClass}">${escapeHtml(ticket.status || "unknown")}</span>
            <span>شناسه: ${escapeHtml(ticket.id || "N/A")}</span>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function updateGlobalStatus() {
      const badge = document.getElementById("statusBadge");
      badge.className = `status-badge ${paperclipOnline ? "online" : ""}`;
      badge.textContent = paperclipOnline ? "Paperclip آنلاین" : "Paperclip در دسترس نیست";
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

      const tab = document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`);
      const content = document.getElementById(`${tabName}Tab`);

      if (tab) tab.classList.add("active");
      if (content) content.classList.add("active");
    }

    function startPolling() {
      pollTimer = setInterval(refreshAll, POLL_INTERVAL);
    }

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
    }

    // Utility functions
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleString("fa-IR");
    }
  </script>
</body>
</html>
